<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>RGGV Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12;
  --accent:#7c5cff;
  --pink:#f06595;
  --text:#e8ecf4;
  --muted:#8b95a8;
  --border:#2a3142;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Press Start 2P',monospace;color:var(--text)}
body{display:flex;align-items:center;justify-content:center}
.widget{
  width:100%;
  aspect-ratio:4/1;
  max-width:100%;
  background:linear-gradient(180deg,#0b0d12 0%,#13171f 100%);
  border:3px solid var(--accent);
  border-radius:12px;
  padding:18px 14px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:12px;
  box-shadow:0 0 20px rgba(124,92,255,.35);
}
.top-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:10px;
}
.timer{
  font-size:clamp(28px,8vw,64px);
  text-align:left;
  color:var(--accent);
  line-height:1.2;
  text-shadow:0 0 12px rgba(124,92,255,.6);
}
.total{
  font-size:clamp(16px,4.5vw,32px);
  text-align:right;
  color:var(--pink);
}
.label{
  font-size:clamp(8px,2.2vw,14px);
  color:var(--muted);
  letter-spacing:1px;
  margin-top:4px;
}
.label-left{text-align:left}
.label-right{text-align:right}
.bar-wrap{
  width:100%;
  height:18px;
  background:#1a1f2b;
  border:2px solid var(--border);
  border-radius:6px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--accent),var(--pink));
  transition:width .4s linear;
}
</style>
</head>
<body>
<div class="widget">
  <div class="top-row">
    <div>
      <div class="timer" id="timer">--:--</div>
      <div class="label label-left">ТАЙМЕР</div>
    </div>
    <div>
      <div class="total" id="total">0 м</div>
      <div class="label label-right">ВСЕГО</div>
    </div>
  </div>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
</div>
<script>
function pad(n){return String(n).padStart(2,'0');}
function formatTotal(min){
  min = Math.max(0, Math.floor(min || 0));
  const h = Math.floor(min / 60);
  const m = min % 60;
  if(h > 0) return h + ' ч ' + m + ' м';
  return m + ' м';
}
function render(){
  // template only — no data binding
  document.getElementById('timer').textContent = '--:--';
  document.getElementById('total').textContent = '0 м';
  document.getElementById('bar').style.width = '0%';
}
render();
</script>
</body>
</html>
